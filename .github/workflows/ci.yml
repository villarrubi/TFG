name: Validación

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias reproducibles
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Instalar Chromium para pruebas de interfaz
        run: python -m playwright install --with-deps chromium
      - name: Pruebas Python
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Calidad estática
        run: python -m ruff check src tests browser_tests scripts
      - name: Calibración y evaluación reproducibles
        env:
          PYTHONPATH: src
        run: |
          python scripts/calibrate_combined.py --check
          python scripts/evaluate_models.py
          git diff --exit-code -- EVALUATION_REPORT.md evaluation/calibration_results.json evaluation/results.json
      - name: Pruebas reales de navegador
        run: python -m unittest discover -s browser_tests -p "test_*.py"
